# The app now lives at https://soundtracktotheworld.com (Cloudflare Pages,
# which builds it straight from this repo). This workflow keeps the old
# GitHub Pages address alive as a forwarding page, so old links (including
# shared station links) land on the new site.
name: Forward old GitHub Pages address

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Make the forwarding page
        run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head>
          <meta charset="utf-8">
          <title>Soundtrack to the World has moved</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://soundtracktotheworld.com/">
          <meta http-equiv="refresh" content="2; url=https://soundtracktotheworld.com/">
          <script>location.replace("https://soundtracktotheworld.com/" + location.search + location.hash);</script>
          <style>body{background:#0a0d1a;color:#dfe6f3;font:18px system-ui,sans-serif;display:grid;place-items:center;height:100vh;margin:0}a{color:#ffad33}</style>
          </head><body>
          <p>Soundtrack to the World has moved to <a href="https://soundtracktotheworld.com/">soundtracktotheworld.com</a></p>
          </body></html>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
