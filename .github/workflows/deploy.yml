# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
# Optional: Settings → Secrets and variables → Actions → Variables →
#   PROXY_URL = https://stw-proxy.<your-name>.workers.dev
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so the station snapshot stays fresh (15:30 UTC is
  # about 4:30am in New Zealand)
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The whole Radio Browser directory, trimmed into one file the app
      # loads (public/data/stations.json). If the directory is down, this
      # step just skips and the app loads stations the old way.
      - run: node scripts/build-snapshot.mjs
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_PROXY_URL: ${{ vars.PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
