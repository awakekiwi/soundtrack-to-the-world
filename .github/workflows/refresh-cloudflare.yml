# Rebuilds the Cloudflare Pages site every 3 hours, so the station snapshot
# and the real-cloud map stay fresh (Cloudflare only rebuilds on pushes by
# itself). One-time setup: Cloudflare → your Pages project → Settings →
# Builds → Deploy hooks → add one, then put its URL in this repo as a secret:
# Settings → Secrets and variables → Actions → Secrets → CF_DEPLOY_HOOK
name: Refresh (Cloudflare Pages)

on:
  # Every 3 hours, a little after EUMETSAT's new cloud map is out
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Cloudflare to rebuild
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No CF_DEPLOY_HOOK secret yet: skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
